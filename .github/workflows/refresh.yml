name: Refresh T-100 data
on:
  schedule:
    - cron: "17 9 15 * *"
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "Re-render index.html from template.html only (no downloads)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Rebuild index.html from latest BTS data
        if: ${{ inputs.rebuild_only != true }}
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: python refresh_data.py
      - name: Re-render index.html from template
        if: ${{ inputs.rebuild_only == true }}
        run: python refresh_data.py --rebuild-only
      - name: Commit if changed
        run: |
          git config user.name "empty-seats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            if [ "${{ inputs.rebuild_only }}" = "true" ]; then
              git commit -m "Rebuild index.html from template"
            else
              git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
            fi
            git push
          fi
