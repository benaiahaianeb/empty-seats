<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empty Seats</title>
<style>
  :root{
    --primary:#0066CC; --primary-dark:#0052A3; --primary-pastel:#EAF2FB;
    --success:#4CAF50; --success-text:#2E7D32;
    --warning:#FFC107; --warning-text:#B26A00; --warning-pastel:#FFF8E1;
    --error:#F44336;   --error-text:#C62828;
    --bg:#FAFAFA; --surface:#FFFFFF; --text:#212121; --text-secondary:#616161;
    --divider:#E0E0E0; --radius:4px;
    --hover:#F5F5F5; --track:#EEEEEE;
    --on-primary:#FFFFFF; --chip-on-text:#0D47A1;
    --warn-chip-bg:#FFF8E1; --warn-chip-text:#7B5800;
    --shadow-2:0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    /* data font: system stack with tabular numerals, not monospace */
    --mono:var(--font);
  }
  html[data-theme="dark"]{
    --primary:#69B1FF; --primary-dark:#8CC4FF; --primary-pastel:#16324F;
    --success-text:#81C784; --warning-text:#FFB74D; --error-text:#E57373;
    --error:#EF5350;
    --bg:#121212; --surface:#1E1E1E; --text:#E6E6E6; --text-secondary:#A0A0A0;
    --divider:#333333; --hover:#2A2A2A; --track:#333333;
    --on-primary:#0A2540; --chip-on-text:#A6CFFF;
    --warn-chip-bg:#2E2410; --warn-chip-text:#FFD54F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 16px 64px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .brand{font-size:24px;font-weight:500}
  .brand em{font-style:normal;color:var(--primary)}
  .sub{color:var(--text-secondary);font-size:13px;margin-top:2px}
  .datastamp{font-size:12px;color:var(--text-secondary);text-align:right;line-height:1.5}
  .themebtn{font:inherit;font-size:12px;font-weight:500;color:var(--primary);background:none;border:none;cursor:pointer;padding:2px 0}

  .controls{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);padding:16px;
    display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px}
  @media(max-width:760px){.controls{grid-template-columns:1fr}}
  .ctl-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:flex;align-items:center;
    gap:10px;flex-wrap:wrap;row-gap:8px;min-width:0}
  .origin-box{position:relative}
  .origin-input{width:100%;background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);color:var(--text);
    font-size:14px;padding:8px 8px;outline:none}
  .origin-input:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .origin-menu{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--divider);
    border-radius:var(--radius);max-height:260px;overflow:auto;display:none;box-shadow:var(--shadow-2)}
  .origin-menu.open{display:block}
  .origin-opt{padding:8px 12px;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:baseline}
  .origin-opt:hover{background:var(--hover)}
  .origin-opt .code{color:var(--primary);font-weight:500;width:44px}
  .origin-opt .city{color:var(--text-secondary)}

  .modeswitch{display:inline-flex;flex:0 0 auto;border:1px solid var(--divider);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
  .modeswitch button{font:inherit;font-size:13px;font-weight:500;background:transparent;border:none;color:var(--text-secondary);
    padding:5px 12px;cursor:pointer;white-space:nowrap;transition:background-color 150ms ease}
  .modeswitch button+button{border-left:1px solid var(--divider)}
  .modeswitch button.on{background:var(--primary);color:var(--on-primary)}

  .months{display:flex;gap:4px;flex-wrap:wrap}
  .mo{font:inherit;font-size:13px;font-weight:500;padding:6px 0;width:52px;text-align:center;
    background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);color:var(--text-secondary);cursor:pointer;
    transition:background-color 150ms ease}
  .mo:hover{background:var(--hover);color:var(--text)}
  .mo.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .mo .yr{display:block;font-size:10px;opacity:.8}
  .mo:focus-visible,.origin-input:focus-visible,.chip:focus-visible,button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

  .weekpick{display:none}
  .weekpick.on{display:block}
  .monthpick.off{display:none}
  .weekrow{display:flex;align-items:center;gap:10px}
  .wbtn{font:inherit;font-size:14px;background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);color:var(--text);
    width:32px;height:32px;cursor:pointer}
  .wbtn:hover{background:var(--hover)}
  input[type=range]{flex:1;accent-color:var(--primary);height:32px}
  .weekout{margin-top:6px;font-size:13px;color:var(--text-secondary)}
  .weekout b{color:var(--text);font-weight:500}
  .estbadge{font-size:11px;font-weight:500;color:var(--warn-chip-text);background:var(--warn-chip-bg);border-radius:var(--radius);padding:1px 6px;margin-left:6px}

  .filters{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--divider);padding-top:12px}
  .chip{font:inherit;font-size:13px;font-weight:500;padding:5px 10px;border-radius:var(--radius);border:1px solid var(--divider);
    background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:background-color 150ms ease}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--primary-pastel);border-color:var(--primary);color:var(--chip-on-text)}
  .chip-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chip-cap{font-size:12px;color:var(--text-secondary);margin-right:2px}
  .spacer{flex:1}
  .dest-search{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);color:var(--text);font-size:13px;
    padding:6px 10px;outline:none;width:190px}
  .dest-search:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}

  .summary{margin:20px 2px 8px;font-size:16px;color:var(--text-secondary)}
  .summary strong{color:var(--text);font-weight:500}

  .viewtabs{display:flex;border-bottom:1px solid var(--divider);margin-top:20px}
  .vtab{padding:12px 16px;font:inherit;font-weight:500;font-size:14px;color:var(--text-secondary);
    border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:color 150ms ease}
  .vtab:hover{color:var(--text)}
  .vtab.on{color:var(--primary);border-bottom-color:var(--primary)}

  .board{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);overflow:hidden;margin-top:8px}
  .thead{display:grid;grid-template-columns:92px 1fr 200px 210px 110px;gap:0;align-items:center;
    padding:0 16px;height:40px;border-bottom:1px solid var(--divider);background:var(--surface)}
  .th{font:inherit;font-size:12px;font-weight:500;color:var(--text-secondary);
    cursor:pointer;user-select:none;background:none;border:none;text-align:left;padding:0}
  .th:hover{color:var(--text)}
  .th.right{text-align:right}
  .th.active{color:var(--primary)}
  .th .arr{font-size:10px}

  .rowbtn{width:100%;display:grid;grid-template-columns:92px 1fr 200px 210px 110px;align-items:center;
    padding:10px 16px;border:none;border-bottom:1px solid var(--divider);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;
    font:inherit;transition:background-color 150ms ease}
  .rowbtn:hover{background:var(--hover)}
  .dcode{font-family:var(--font);font-variant-numeric:tabular-nums;font-weight:500;font-size:16px;color:var(--primary)}
  .dcity{font-size:14px;color:var(--text);padding-right:10px;line-height:1.3}
  .tag{font-size:11px;color:var(--text-secondary);border:1px solid var(--divider);
    border-radius:var(--radius);padding:1px 5px;margin-left:6px;vertical-align:1px;white-space:nowrap;background:var(--surface)}
  .sched{font-family:var(--font);font-variant-numeric:tabular-nums;font-size:13px;color:var(--text);padding-right:14px;line-height:1.4}
  .sched b{font-weight:500}
  .sched.irr b{font-weight:400;color:var(--text-secondary)}
  .sched small{display:block;font-size:12px;color:var(--text-secondary);margin-top:1px}
  .sched .noflying{color:var(--text-secondary)}
  .arrline{font-size:11px;color:var(--text-secondary)}
  .legs .arrline{flex-basis:100%;margin-top:2px}
  .altcode{font-size:13px !important}
  .altrow{cursor:pointer}
  .altdetail{border-bottom:1px solid var(--divider);background:var(--bg);padding:12px 16px 14px;display:none}
  .altdetail.open{display:block}
  .legrow+.legrow{margin-top:10px}
  .legrow b{font-weight:500}
  .legrow .dim{color:var(--text-secondary);font-size:12px;margin-left:8px}
  .legtimes{font-variant-numeric:tabular-nums;font-size:13px;margin-top:3px;line-height:1.6}
  .legtimes .na{color:var(--text-secondary)}
  .altrow.orig{box-shadow:inset 3px 0 0 var(--primary)}
  .altrow .legs{grid-column:span 2;padding-right:10px}

  .gauge{display:flex;align-items:center;gap:10px;padding:0 14px}
  .cabin{flex:1;height:10px;border-radius:2px;background:var(--track);border:1px solid var(--divider);position:relative;overflow:hidden}
  .fill{position:absolute;inset:0;right:auto;border-radius:1px}
  .lfnum{font-variant-numeric:tabular-nums;font-size:13px;width:52px;text-align:right}

  .opennum{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;text-align:right}
  .opennum small{display:block;font-family:var(--font);font-weight:400;font-size:11px;color:var(--text-secondary)}
  .opennum .mcap{display:none}

  .season{border-bottom:1px solid var(--divider);background:var(--bg);padding:16px 20px 20px;display:none}
  .season.open{display:block}
  .season h4{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:12px}
  .season h4 b{color:var(--text);font-weight:500}
  .strip{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end}
  .mcell{text-align:center}
  .mbar{position:relative;height:80px;background:var(--surface);border:1px solid var(--divider);border-radius:2px;overflow:hidden;margin-bottom:6px}
  .mbar .bf{position:absolute;left:0;right:0;bottom:0}
  .mbar.best{border-color:var(--success-text)}
  .mbar.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
  .mbar.na{opacity:.35}
  .mlab{font-size:12px;color:var(--text-secondary)}
  .mlab i{font-style:normal;font-size:10px;color:var(--text-secondary);display:block}
  .mval{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text)}
  .mval small{display:block;font-size:10px;color:var(--text-secondary)}
  .mval .mdays{font-size:10px;color:var(--text-secondary);margin-top:1px}
  @media(max-width:860px){
    .thead{display:none}
    .opennum .mcap{display:block}
    .rowbtn{grid-template-columns:70px 1fr 100px;grid-template-areas:"code city open" "sched sched sched" "gauge gauge gauge";row-gap:8px}
    .dcode{grid-area:code}.dcity{grid-area:city}.opennum{grid-area:open}
    .sched{grid-area:sched;padding:0}
    .altrow .legs{grid-area:sched}
    .gauge{grid-area:gauge;padding:0}
    .strip{grid-template-columns:repeat(6,1fr);row-gap:12px}
  }

  .empty{padding:32px 20px;text-align:center;color:var(--text-secondary);font-size:14px}
  .empty b{color:var(--text);font-weight:500}

  .triprow{width:100%;display:grid;grid-template-columns:240px 1fr 130px;align-items:center;
    padding:12px 16px;border-bottom:1px solid var(--divider);background:var(--surface);color:var(--text);text-align:left}
  .legs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-right:10px}
  .leg{font-variant-numeric:tabular-nums;font-size:12px;background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);padding:3px 7px;white-space:nowrap}
  .leg b{font-weight:600}
  .leg small{color:var(--text-secondary);font-size:11px}
  .legarrow{color:var(--text-secondary);font-size:12px}
  @media(max-width:860px){
    .triprow{grid-template-columns:1fr 110px;grid-template-areas:"dest open" "legs legs";row-gap:8px}
    .trdest{grid-area:dest}.legs{grid-area:legs}.triprow .opennum{grid-area:open}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Empty <em>Seats</em></div>
      <div class="sub">Average open seats excluding other non-revs.</div>
    </div>
    <div class="datastamp">Scheduled service · <span id="stampRange"></span><br><button id="themeBtn" class="themebtn">Dark mode</button></div>
  </header>

  <div class="controls">
    <div>
      <label class="ctl-label" for="originInput" id="originLabel">Departing from</label>
      <div class="origin-box">
        <input id="originInput" class="origin-input" autocomplete="off" spellcheck="false" placeholder="Type airport or city…">
        <div id="originMenu" class="origin-menu" role="listbox"></div>
      </div>
    </div>
    <div>
      <span class="ctl-label">Travel dates
        <span class="modeswitch">
          <button id="modeMonth" class="on">Month</button>
          <button id="modeWeek">Week</button>
        </span>
        <span class="modeswitch" id="spanSwitch">
          <button id="spanLatest" class="on">Latest</button>
          <button id="spanAvg">3-year average</button>
        </span>
        <span class="modeswitch" id="schedSwitch">
          <button id="schedNewest" class="on">Newest schedule</button>
          <button id="schedSeasonal">Seasonal schedule</button>
        </span>
      </span>
      <div class="monthpick" id="monthPick"><div class="months" id="months"></div></div>
      <div class="weekpick" id="weekPick">
        <div class="weekrow">
          <button class="wbtn" id="wPrev" aria-label="Previous week">‹</button>
          <input type="range" id="weekSlider" min="0" max="1" value="0" aria-label="Select week">
          <button class="wbtn" id="wNext" aria-label="Next week">›</button>
        </div>
        <div class="weekout" id="weekOut"></div>
      </div>
    </div>
    <div class="filters">
      <div class="chip-group" id="geoGroup">
        <span class="chip-cap">Show</span>
        <button class="chip on" data-geo="all">All</button>
        <button class="chip" data-geo="dom">Domestic</button>
        <button class="chip" data-geo="intl">International</button>
      </div>
      <div class="chip-group" id="freqGroup">
        <span class="chip-cap">Frequency</span>
        <button class="chip" data-minf="0">Any</button>
        <button class="chip on" data-minf="0.12">1×/week+</button>
        <button class="chip" data-minf="0.5">½ daily+</button>
        <button class="chip" data-minf="1">Daily+</button>
        <button class="chip" data-minf="3">3×/day+</button>
      </div>
      <div class="chip-group" id="carGroup">
        <span class="chip-cap">Operators</span>
        <button class="chip on" data-car="1" title="Endeavor Air, a wholly owned Delta subsidiary">Endeavor 9E</button>
        <button class="chip on" data-car="2" title="SkyWest segments apportioned by share marketed as Delta in DOT on-time data">SkyWest (est.)</button>
      </div>
      <div class="chip-group" id="vibeGroup" style="display:none">
        <span class="chip-cap">Vibe</span>
        <button class="chip on" data-vibe="all">Anywhere</button>
        <button class="chip" data-vibe="sun">Sun &amp; beach</button>
        <button class="chip" data-vibe="eur">Europe &amp; Med</button>
        <button class="chip" data-vibe="apac">Asia &amp; Pacific</button>
        <button class="chip" data-vibe="latam">Latin America</button>
        <button class="chip" data-vibe="afr">Africa</button>
        <button class="chip" data-vibe="mtn">Mountains &amp; parks</button>
        <button class="chip" data-vibe="city">City breaks</button>
        <button class="chip on" id="gemChip" title="Hide the mega-cities and hubs; show only smaller, less-obvious destinations">Off the beaten path</button>
      </div>
      <div class="chip-group" id="altGroup" style="display:none">
        <span class="chip-cap">To</span>
        <div class="origin-box" style="width:210px">
          <input id="destInput" class="origin-input" autocomplete="off" spellcheck="false" placeholder="Airport or city" style="font-size:13px;padding:6px 10px">
          <div id="destMenu" class="origin-menu" role="listbox"></div>
        </div>
        <span class="chip-cap">Day</span>
        <div class="chip-group" id="dowGroup"></div>
        <span class="chip-cap">Stops</span>
        <div class="chip-group" id="stopsGroup">
          <button class="chip" data-stops="0">Nonstop</button>
          <button class="chip on" data-stops="1">Up to 1</button>
          <button class="chip" data-stops="2">Up to 2</button>
        </div>
        <button class="chip" id="intlChip">Include international</button>
        <span class="chip-cap">Sort</span>
        <div class="chip-group" id="sortGroup">
          <button class="chip on" data-asort="open">Open seats</button>
          <button class="chip" data-asort="arr">Arrival</button>
        </div>
        <span class="chip-cap">Departure radius</span>
        <div class="chip-group" id="radFromGroup">
          <button class="chip" data-radf="0">0</button>
          <button class="chip" data-radf="50">50</button>
          <button class="chip on" data-radf="100">100</button>
          <button class="chip" data-radf="250">250</button>
          <button class="chip" data-radf="500">500 mi</button>
        </div>
        <span class="chip-cap">Destination radius</span>
        <div class="chip-group" id="radToGroup">
          <button class="chip" data-radt="0">0</button>
          <button class="chip" data-radt="50">50</button>
          <button class="chip on" data-radt="100">100</button>
          <button class="chip" data-radt="250">250</button>
          <button class="chip" data-radt="500">500 mi</button>
        </div>
      </div>
      <div class="spacer"></div>
      <input class="dest-search" id="destSearch" placeholder="Filter destinations…">
    </div>
  </div>

  <div class="viewtabs">
    <button class="vtab on" id="tabBoard">Departure board</button>
    <button class="vtab" id="tabTrip">Trip finder</button>
    <button class="vtab" id="tabAlt">Alternatives</button>
  </div>

  <div class="summary" id="summary"></div>

  <div class="board">
    <div class="thead">
      <button class="th" data-sort="code">Dest</button>
      <span class="th">City</span>
      <button class="th" data-sort="fpd">Schedule <span class="arr"></span></button>
      <button class="th" data-sort="lf" style="padding-left:14px">Cabin fill (load factor) <span class="arr"></span></button>
      <button class="th right active" data-sort="open">Open/flight <span class="arr">▼</span></button>
    </div>
    <div id="rows"></div>
  </div>

</div>

<script>
const DATA = /*__DATA__*/null;

// theme: saved choice wins; otherwise dark on mobile, light on desktop
(function(){
  let saved = null;
  try { saved = localStorage.getItem("esa-theme"); } catch(e){}
  let mobile = false;
  try { mobile = window.matchMedia("(max-width: 760px)").matches; } catch(e){}
  const theme = (saved==="dark"||saved==="light")? saved : (mobile? "dark" : "light");
  document.documentElement.dataset.theme = theme;
})();

const MONTH_ABBR = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONTH_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function daysIn(y,m){ return new Date(y,m,0).getDate(); }

// ---- index data ----
const A = DATA.airports;               // [code, city, country]
const rows = DATA.rows;                // [oIdx, dIdx, year, month, dep, seats, pax, carrier]
const byOrigin = new Map();
const byDest = new Map();
for(const r of rows){
  if(!byOrigin.has(r[0])) byOrigin.set(r[0],[]);
  byOrigin.get(r[0]).push(r);
  if(!byDest.has(r[1])) byDest.set(r[1],[]);
  byDest.get(r[1]).push(r);
}
// chronological month points across the data range
const pointKey = (y,m)=> y*100+m;
const pointSet = new Set(rows.map(r=>pointKey(r[2],r[3])));
const POINTS = [...pointSet].sort((a,b)=>a-b).map(k=>({y:Math.floor(k/100), m:k%100}));
POINTS.forEach((p,i)=>{ p.i=i; p.mid = new Date(p.y, p.m-1, 15).getTime(); p.days = daysIn(p.y,p.m); });
const PIDX = new Map(POINTS.map(p=>[pointKey(p.y,p.m), p]));
const yearsByMonth = Array.from({length:13},()=>new Set());
for(const p of POINTS) yearsByMonth[p.m].add(p.y);
const latestYearFor = m => Math.max(...yearsByMonth[m]);

// week list: Mondays whose midpoint (Thu) falls inside [first,last] month midpoints
const WEEKS = (()=>{
  const first = POINTS[0].mid, last = POINTS[POINTS.length-1].mid;
  const out=[];
  let d = new Date(first); // find Monday on/before first mid
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  for(;;){
    const mid = d.getTime() + 3.5*864e5;
    if(mid > last) break;
    if(mid >= first) out.push(new Date(d));
    d = new Date(d.getTime() + 7*864e5);
  }
  return out;
})();

// origin list sorted by total seats
const originSeats = new Map();
for(const r of rows){ originSeats.set(r[0],(originSeats.get(r[0])||0)+r[5]); }
const originList = [...byOrigin.keys()].sort((a,b)=>(originSeats.get(b)||0)-(originSeats.get(a)||0));

// ---- trip finder config ----

      if(hit<0){ ok=false; break; }
      const dep=hhmmMin(bs[L].dep[hit]), arr=hhmmMin(bs[L].arr[hit]);
      if(arr<dep && L<bs.length-1){ ok=false; break; } // mid-trip overnight; not modelled
      cur=arr; lastArr=bs[L].arr[hit];
    }
    if(!ok) continue;
    const nd = cur < d0;
    const key = cur + (nd?1440:0);
    if(best===null || key<best.key) best={t:lastArr, nd, key};
  }
  return best;
}

// true when every leg has arrival data, i.e. the chain can actually be checked
function legsHaveArrivals(legs, dmi){
  return legs.every(l=>{ const b=banksOf(l.f, l.t, dmi); return !!(b && b.arr); });
}
const arrText = (a, at) => a? ("Arrives "+fmtT(a.t)+tzOf(at)+(a.nd? " +1 day":"")) : "";
function opsOnDay(o, d, dmi, dow){
  if(dow<0) return true;
  const key=o+"-"+d;
  let mask=(dmi>=0 && DAYS[key])? DAYS[key][dmi] : 0;
  if(!mask && ITIMES[key] && ITIMES[key].length>1) mask=ITIMES[key][0];
  if(!mask || mask===127) return true;
  return !!(mask>>dow & 1);
}
function computeAlts(){
  if(state.altDest==null) return null;
  const O=A[state.origin][0], D=A[state.altDest][0];
  // dmi = the viewed month, which decides whether a route still exists at all.
  // sdi = the schedule month, which decides what days and times it runs.
  const dmi=currentDaysIdx(), sdi=schedIdx(), dow=state.altDow;
  const MINF=0.4; // ~3x/week per connecting leg, as in the trip finder
  const maxStops=state.altStops;
  const froms=nearbyCodes(O, state.altRadFrom), tos=nearbyCodes(D, state.altRadTo);
  // An airport you could simply drive to is not a connection. Flying into an
  // airport inside your own departure radius means backtracking past it (RST ->
  // MSP when you are at MSP); connecting inside the destination radius means
  // flying past a landing point you already accept.
  const fromSet=new Set(froms.map(x=>x.code)), toSet=new Set(tos.map(x=>x.code));
  // Foreign connecting points sit behind the toggle. Their onward legs carry no
  // departure times at all in this data, so a connection through one can never
  // be checked for same-day feasibility - it is offered, not verified.
  const usOnly = !state.altIntl;
  const isUS = c => { const i=CODE_IDX.get(c); return i!=null && A[i][2]==="US"; };
  const viaOK = c => !fromSet.has(c) && !toSet.has(c) && (!usOnly || isUS(c));
  // A connection has to go roughly the same way as the trip. Without this the
  // widest-open seats win outright and a domestic pair gets routed over Seoul or
  // London: those legs are widebodies with hundreds of empty seats and, having no
  // arrival times, they escape the same-day check as well. Unknown geography is
  // allowed through rather than hidden.
  const MAX_CIRCUITY = state.altIntl? 4 : 2.5;
  function circuityOK(codes){
    const dd=distMi(codes[0], codes[codes.length-1]);
    if(dd==null || dd<=0) return true;
    let sum=0;
    for(let i=0;i+1<codes.length;i++){
      const leg=distMi(codes[i], codes[i+1]);
      if(leg==null) return true;
      sum+=leg;
    }
    return sum <= dd*MAX_CIRCUITY;
  }

  // Connections are not restricted to Delta hubs: any airport with enough
  // service on both legs can carry one (MSP -> MSN -> BOS). destSeries and the
  // per-leg verdict are both cached for the render, which is what keeps the
  // wider search affordable - the same leg is asked about once, not once per
  // origin/destination pair.
  const serCache=new Map();
  const serOf=i=>{ if(!serCache.has(i)) serCache.set(i,destSeries(i)); return serCache.get(i); };
  const legCache=new Map();
  function legMetric(fi, ti){ // usable connecting leg, or null
    const k=fi*100000+ti;
    if(legCache.has(k)) return legCache.get(k);
    const f=A[fi][0], t=A[ti][0];
    let m=metricFromSeries(serOf(fi).get(ti));
    if(m && (m.fpd<MINF || isDeadRoute(m.fpd,f,t,dmi) || !opsOnDay(f,t,sdi,dow))) m=null;
    legCache.set(k,m||null);
    return m||null;
  }

  // last leg into each destination, from anywhere; independent of the origin
  const toDestByD={};
  for(const nd of tos){
    const di=CODE_IDX.get(nd.code);
    if(di==null) continue;
    const t={};
    if(maxStops>=1){
      for(const xi of originSeries(di).keys()){
        const xc=A[xi][0];
        if(xc===nd.code || !viaOK(xc)) continue;
        const m=legMetric(xi, di);
        if(m) t[xc]=m;
      }
    }
    toDestByD[nd.code]=t;
  }

  const list=[];
  for(const no of froms){
    const oi=CODE_IDX.get(no.code);
    if(oi==null || !byOrigin.has(oi)) continue;
    const ser=serOf(oi);
    const viaFrom={}; // first leg out of this origin, same for every destination
    for(const xi of ser.keys()){
      const xc=A[xi][0];
      if(xc===no.code || !viaOK(xc)) continue;
      const m=legMetric(oi, xi);
      if(m) viaFrom[xc]=m;
    }
    for(const nd of tos){
      if(nd.code===no.code) continue;
      const di=CODE_IDX.get(nd.code);
      if(di==null) continue;
      const options=[];
      const direct=metricFromSeries(ser.get(di));
      if(direct && !isDeadRoute(direct.fpd, no.code, nd.code, dmi)
          && opsOnDay(no.code, nd.code, sdi, dow))
        options.push({legs:[{f:no.code,t:nd.code,m:direct}], bn:direct.open, direct:true});
      const toDest=toDestByD[nd.code]||{};
      if(maxStops>=1){
        for(const x in viaFrom){
          if(x===nd.code || x===no.code) continue;
          const m2=toDest[x];
          if(!m2 || !circuityOK([no.code,x,nd.code])) continue;
          options.push({legs:[{f:no.code,t:x,m:viaFrom[x]},{f:x,t:nd.code,m:m2}],
                        bn:Math.min(viaFrom[x].open, m2.open)});
        }
      }
      if(maxStops>=2){
        for(const x1 in viaFrom){
          if(x1===nd.code || x1===no.code) continue;
          const x1i=CODE_IDX.get(x1);
          for(const x2 in toDest){
            if(x2===x1 || x2===no.code || x2===nd.code) continue;
            const mm=legMetric(x1i, CODE_IDX.get(x2));
            if(!mm || !circuityOK([no.code,x1,x2,nd.code])) continue;
            options.push({legs:[{f:no.code,t:x1,m:viaFrom[x1]},
                                {f:x1,t:x2,m:mm},
                                {f:x2,t:nd.code,m:toDest[x2]}],
                          bn:Math.min(viaFrom[x1].open, mm.open, toDest[x2].open)});
          }
        }
      }
      if(!options.length) continue;
      // drop connections that cannot be made the same day; keep ones we can't
      // check (international legs carry departures but no arrivals)
      for(const o of options) o.arr=earliestArrival(o.legs, sdi);
      const usable=options.filter(o=> o.legs.length===1 || o.arr!==null
                                      || !legsHaveArrivals(o.legs, sdi));
      if(!usable.length) continue;
      usable.sort((a,b)=>b.bn-a.bn);
      let best=usable[0];
      for(let k=1;k<=3;k++){ // prefer the fewest stops that stays within 5 open seats
        const cand=usable.find(o=>o.legs.length===k);
        if(cand && cand.bn >= best.bn-5){ best=cand; break; }
      }
      list.push({o:no.code, d:nd.code, om:no.mi, dm2:nd.mi,
                 legs:best.legs, bn:best.bn, arr:best.arr,
                 m:best.legs.length===1? best.legs[0].m : null,
                 worstLf:Math.max(...best.legs.map(l=>l.m.lf)),
                 orig:no.code===O && nd.code===D});
    }
  }
  if(state.altSort==="arr")
    list.sort((a,b)=> (a.arr===null)-(b.arr===null)
      || ((a.arr&&b.arr)? a.arr.key-b.arr.key : 0) || (b.bn-a.bn));
  else list.sort((a,b)=>b.bn-a.bn);
  return list;
}
function legTimesHTML(f, t, dmi){
  const b=banksOf(f, t, dmi);
  const key=f+"-"+t;
  let mask=(dmi>=0 && DAYS[key])? DAYS[key][dmi] : 0;
  if(!mask && ITIMES[key] && ITIMES[key].length>1) mask=ITIMES[key][0];
  const dl=(mask>0 && mask<127)? daysLabel(mask) : null;
  let note=dl? dl : "";
  if(b && TZ[f]) note += (note? " · ":"") + (b.arr && TZ[t] && TZ[t]!==TZ[f]? TZ[f]+" → "+TZ[t] : TZ[f]);
  let times;
  if(!b || !b.dep.length) times='<span class="na">No schedule data</span>';
  else if(b.arr) times=b.dep.map((d,i)=>fmtT(d)+" → "+fmtT(b.arr[i])).join(" · ");
  else {
    // no arrival times for this leg: lead with the estimated flight time, which
    // needs no timezone, and put the clock arrival behind it
    const est=estLegText(f, t, b.dep[0], dmi);
    times=b.dep.map(fmtT).join(" · ")
      + (est? ' <span class="na">'+esc(est)+"</span>"
            : ' <span class="na">(departures only)</span>');
  }
  return '<div class="legrow"><b>'+f+" → "+t+"</b>"
    +(note? '<span class="dim">'+note+"</span>" : "")
    +'<div class="legtimes">'+times+"</div></div>";
}
function altDetailHTML(r, dmi){
  return r.legs.map(l=>legTimesHTML(l.f, l.t, dmi)).join("");
}

function computeTrips(){
  const oIdx = state.origin, oCode = A[oIdx][0];
  const oSer = destSeries(oIdx);
  const MINF = 0.4; // ~3x/week per leg minimum for realistic standby
  // dmi decides whether a route still exists; sdi is the schedule being shown
  const dmi = currentDaysIdx(), sdi = schedIdx();
  // Same rules as the Alternatives tab: any airport with enough service on both
  // legs can carry a connection, not just the nine hubs, but it has to lie
  // roughly on the way and it cannot be the origin itself.
  const usOnly = !state.altIntl;
  const isUS = c => { const i=CODE_IDX.get(c); return i!=null && A[i][2]==="US"; };
  const MAX_CIRCUITY = state.altIntl? 4 : 2.5;
  function circuityOK(codes){
    const dd=distMi(codes[0], codes[codes.length-1]);
    if(dd==null || dd<=0) return true;
    let sum=0;
    for(let i=0;i+1<codes.length;i++){
      const leg=distMi(codes[i], codes[i+1]);
      if(leg==null) return true;
      sum+=leg;
    }
    return sum <= dd*MAX_CIRCUITY;
  }
  const serCache=new Map();
  const serOf=i=>{ if(!serCache.has(i)) serCache.set(i,destSeries(i)); return serCache.get(i); };
  const legCache=new Map();
  function legMetric(fi, ti){
    const k=fi*100000+ti;
    if(legCache.has(k)) return legCache.get(k);
    const f=A[fi][0], t=A[ti][0];
    let m=metricFromSeries(serOf(fi).get(ti));
    if(m && (m.fpd<MINF || isDeadRoute(m.fpd,f,t,dmi))) m=null;
    legCache.set(k, m||null);
    return m||null;
  }
  // first leg out of the origin, shared by every destination
  const viaFrom={};
  for(const xi of oSer.keys()){
    const xc=A[xi][0];
    if(xc===oCode || (usOnly && !isUS(xc))) continue;
    const m=legMetric(oIdx, xi);
    if(m) viaFrom[xc]=m;
  }
  const out = [];
  for(const code in VIBES){
    const tags = VIBES[code];
    if(state.vibe!=="all" && !tags.includes(state.vibe)) continue;
    if(state.gemsOnly && !tags.includes("g")) continue;
    const d = CODE_IDX.get(code);
    if(d==null || d===oIdx) continue;
    const options = [];
    const direct = metricFromSeries(oSer.get(d));
    if(direct && direct.fpd>=MINF && !isDeadRoute(direct.fpd,oCode,code,dmi))
      options.push({legs:[{f:oCode,t:code,m:direct}], bn:direct.open, direct:true});
    for(const xi of originSeries(d).keys()){
      const xc=A[xi][0];
      if(xc===code || xc===oCode || !viaFrom[xc]) continue;
      const m2=legMetric(xi, d);
      if(!m2 || !circuityOK([oCode,xc,code])) continue;
      options.push({legs:[{f:oCode,t:xc,m:viaFrom[xc]},{f:xc,t:code,m:m2}],
                    bn:Math.min(viaFrom[xc].open, m2.open), direct:false});
    }
    if(!options.length) continue;
    // drop connections that cannot be made the same day; keep the ones we cannot
    // check, which is international legs carrying departures but no arrivals
    const usable=options.filter(o=> o.legs.length===1
      || earliestArrival(o.legs, sdi)!==null || !legsHaveArrivals(o.legs, sdi));
    if(!usable.length) continue;
    usable.sort((a,b)=>b.bn-a.bn);
    let best = usable[0];
    const dOpt = usable.find(o=>o.direct);
    if(dOpt && dOpt.bn >= best.bn-5) best = dOpt; // prefer nonstop when close
    const ap = A[d];
    out.push({d, code, city:ap[1], tags, legs:best.legs, bn:best.bn,
      sumOpen:best.legs.reduce((s,l)=>s+l.m.open,0),
      worstLf:Math.max(...best.legs.map(l=>l.m.lf))});
  }
  out.sort((a,b)=> (b.bn-a.bn) || (b.sumOpen-a.sumOpen) || (a.legs.length-b.legs.length));
  return out;
}

function passesGeoFreq(d, m){
  const ap=A[d], intl=ap[2]!=="US";
  if(state.geo==="dom" && intl) return false;
  if(state.geo==="intl" && !intl) return false;
  if(m.fpd < state.minFpd) return false;
  return true;
}
function buildRow(d, m, extra){
  const ap=A[d];
  return Object.assign({d, code:ap[0], city:ap[1], intl:ap[2]!=="US"}, m, extra);
}

function computeMonth(originIdx, month){
  const year = latestYearFor(month);
  const p = PIDX.get(pointKey(year,month));
  const series = destSeries(originIdx);
  const dmi = currentDaysIdx(), oCode = A[originIdx][0];
  const out=[];
  for(const [d,arr] of series){
    let m;
    if(state.span==="avg"){ m = avgMetric(arr, month); }
    else { const a = arr[p.i]; if(!a || a.dep<1 || a.seats<1) continue; m = metricsAt(a,p); }
    if(!m) continue;
    if(!passesGeoFreq(d,m)) continue;
    if(isDeadRoute(m.fpd, oCode, A[d][0], dmi)) continue;
    out.push(buildRow(d,m,{year}));
  }
  return finish(out);
}

function computeWeek(originIdx, wi){
  const t = WEEKS[wi].getTime()+3.5*864e5;
  // bracket points
  let i2 = POINTS.findIndex(p=>p.mid>=t);
  if(i2<0) i2=POINTS.length-1;
  const i1 = Math.max(0, POINTS[i2].mid===t? i2 : i2-1);
  const p1=POINTS[i1], p2=POINTS[i2];
  const f = p2.mid===p1.mid? 0 : (t-p1.mid)/(p2.mid-p1.mid);
  const series = destSeries(originIdx);
  const dmi = currentDaysIdx(), oCode = A[originIdx][0];
  const out=[];
  for(const [d,arr] of series){
    const a1=arr[i1], a2=arr[i2];
    if(!a1 || !a2 || a1.dep<1 || a2.dep<1 || a1.seats<1 || a2.seats<1) continue; // needs service both sides
    const m1=metricsAt(a1,p1), m2=metricsAt(a2,p2);
    const m={}; for(const k of ["fpd","spf","lf","open"]) m[k]=m1[k]+(m2[k]-m1[k])*f;
    if(!passesGeoFreq(d,m)) continue;
    if(isDeadRoute(m.fpd, oCode, A[d][0], dmi)) continue;
    out.push(buildRow(d,m,{p1,p2}));
  }
  return finish(out);
}

function finish(out){
  const q = state.destFilter.trim().toLowerCase();
  const filtered = q? out.filter(o=>o.code.toLowerCase().includes(q)||o.city.toLowerCase().includes(q)) : out;
  const dir=state.dir, key=state.sort;
  filtered.sort((a,b)=> key==="code"? dir*a.code.localeCompare(b.code) : dir*(a[key]-b[key]));
  return filtered;
}

    b.onclick = ()=>{ state.month=m; state.expanded=null; renderMonths(); renderBoard(); };
    el.appendChild(b);
  }

// ---- board ----
function renderBoard(){
  if(state.view==="trip"){ renderTrips(); return; }
  if(state.view==="alt"){ renderAlts(); return; }
  const isWeek = state.mode==="week";
  const list = isWeek? computeWeek(state.origin,state.week) : computeMonth(state.origin,state.month);
  const cont = document.getElementById("rows");
  const oa = A[state.origin];
  const sum = document.getElementById("summary");
  const whenTxt = whenText();
  if(list.length){
    sum.innerHTML = "<strong>"+list.length+" destinations</strong> from "+oa[0]+" · "+whenTxt+esc(schedNote())+(isWeek?' <span class="estbadge">Estimate</span>':"");
  } else sum.textContent="";

  if(!list.length){
    cont.innerHTML='<div class="empty">No routes match.</div>';
    return;
  }
  const dmi = schedIdx();
  let html="";
  list.forEach((r,i)=>{
    const colB=lfColor(r.lf), colT=lfText(r.lf);
    const isOpen=state.expanded===r.d;
    html += '<button class="rowbtn" data-d="'+r.d+'" aria-expanded="'+isOpen+'">'
      +'<span class="dcode">'+r.code+"</span>"
      +'<span class="dcity">'+esc(r.city)+(r.intl?'<span class="tag">INTL</span>':"")+"</span>"
      +schedHTML(r.fpd,oa[0],r.code,dmi)
      +'<span class="gauge"><span class="cabin"><span class="fill" style="width:'+Math.min(100,r.lf).toFixed(1)+'%;background:'+colB+'"></span></span><span class="lfnum" style="color:'+colT+'">'+r.lf.toFixed(0)+"%</span></span>"
      +'<span class="opennum" style="color:'+colT+'">'+Math.round(r.open)+'<small class="mcap">open seats/flight</small></span>'
      +"</button>"
      +'<div class="season'+(isOpen?" open":"")+'">'+(isOpen? seasonHTML(r):"")+"</div>";
  });
  cont.innerHTML=html;
  cont.querySelectorAll(".rowbtn").forEach(b=>{
    b.addEventListener("click",()=>{
      const d=+b.dataset.d;
      state.expanded = state.expanded===d? null : d;
      renderBoard();
    });
  });
}

function seasonHTML(r){
  const series = destSeries(state.origin).get(r.d) || [];
  const oa=A[state.origin];
  // selected point(s) to highlight
  let selIdx = new Set();
  if(state.mode==="month"){ const p=PIDX.get(pointKey(latestYearFor(state.month),state.month)); if(p) selIdx.add(p.i); }
  else {
    const t=WEEKS[state.week].getTime()+3.5*864e5;
    let i2=POINTS.findIndex(p=>p.mid>=t); if(i2<0)i2=POINTS.length-1;
    selIdx.add(i2); selIdx.add(Math.max(0,POINTS[i2].mid===t?i2:i2-1));
  }
  const avgMode = (state.mode==="month" && state.span==="avg");
  let cells;
  if(avgMode){
    cells = [];
    for(let mm=1; mm<=12; mm++){
      let dep=0, seats=0, pax=0, days=0;
      for(const p of POINTS){
        if(p.m!==mm) continue;
        const a=series[p.i];
        if(!a || a.dep<1 || a.seats<1) continue;
        dep+=a.dep; seats+=a.seats; pax+=a.pax; days+=p.days;
      }
      if(dep<1 || seats<1){ cells.push({p:{m:mm,y:0,i:-1}, na:true}); continue; }
      cells.push({p:{m:mm,y:0,i:-1}, lf:pax/seats*100, open:(seats-pax)/dep, fpd:dep/days});
    }
  } else {
    cells = POINTS.slice(-12).map(p=>{
      const a=series[p.i];
      if(!a||a.dep<1) return {p,na:true};
      const m=metricsAt(a,p);
      return {p,lf:m.lf,open:m.open,fpd:m.fpd};
    });
  }
  const dayArr = DAYS[oa[0]+"-"+r.code];
  const avail = cells.filter(c=>!c.na);
  const maxOpen = Math.max(...avail.map(c=>c.open),1);
  let best=null; for(const c of avail){ if(!best||c.open>best.open) best=c; }
  let h='<h4><b>'+oa[0]+' → '+r.code+"</b> · open seats per flight by month"+(avgMode?" · 3-year average":"")+" · ≈"+Math.round(r.spf)+" seats/flight</h4><div class='strip'>";
  for(const c of cells){
    const lab = MONTH_ABBR[c.p.m-1].slice(0,1)+MONTH_ABBR[c.p.m-1].slice(1).toLowerCase();
    const yr = (!avgMode && (c.p.m===1||c===cells[0]))? "’"+String(c.p.y).slice(2) : "";
    if(c.na){ h+='<div class="mcell"><div class="mbar na"></div><div class="mlab">'+lab+'<i>'+yr+'</i></div><div class="mval">—</div></div>'; continue; }
    const hp=Math.max(6,c.open/maxOpen*100), col=lfColor(c.lf);
    const cls = (best===c?" best":"")+((avgMode? c.p.m===state.month : selIdx.has(c.p.i))?" sel":"");
    let dtxt="";
    if(c.fpd<0.9 && dayArr && c.p.y){
      const di = DM_IDX.get(c.p.y+"-"+String(c.p.m).padStart(2,"0"));
      const mk = di==null? 0 : dayArr[di];
      if(mk>0 && mk<127){ const dl=daysLabel(mk); if(dl) dtxt='<small class="mdays">'+dl+'</small>'; }
    }
    h+='<div class="mcell"><div class="mbar'+cls+'" title="'+MONTH_FULL[c.p.m-1]+(avgMode?" · 3-year average":" "+c.p.y)+': '+c.lf.toFixed(1)+'% full">'
      +'<div class="bf" style="height:'+hp.toFixed(0)+'%;background:'+col+'"></div></div>'
      +'<div class="mlab">'+lab+'<i>'+(yr||"&nbsp;")+'</i></div>'
      +'<div class="mval">'+Math.round(c.open)+"<small>"+c.lf.toFixed(0)+"%</small>"+dtxt+"</div>";
    h+="</div>";
  }
  h+="</div>";
  return h;
}
